version: "2"
sql:
  - engine: "postgresql"
    schema: "catalog/db/migration"
    queries: "catalog/db/queries"
    gen:
      go:
        package: "store"
        out: "catalog/db/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
  - engine: "postgresql"
    schema: "booking/db/migration"
    queries: "booking/db/queries"
    gen:
      go:
        package: "store"
        out: "booking/db/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true

