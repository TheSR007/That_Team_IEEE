events {
    worker_connections 1024;
}

http {
    upstream health_backend {
        server health:8085;
    }
    upstream catalog_backend {
        server catalog:8081;
    }
    upstream booking_backend {
        server booking:8082;
    }
    upstream payment_backend {
        server payment:8083;
    }

    server {
        listen 8080;

        # Healthcheck endpoint (proxied to dedicated Health Service)
        location /health {
            proxy_pass http://health_backend/health;
        }

        # Catalog domain
        location /api/v1/movies {
            proxy_pass http://catalog_backend/api/v1/movies;
        }
        location /api/v1/showtimes {
            proxy_pass http://catalog_backend/api/v1/showtimes;
        }

        # Booking / holds domain
        location /api/v1/holds {
            proxy_pass http://booking_backend/api/v1/holds;
        }
        location /api/v1/bookings {
            proxy_pass http://booking_backend/api/v1/bookings;
        }

        # WebSocket live seat map
        location /ws {
            proxy_pass http://booking_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Payment & OTP domain
        location /api/v1/payments {
            proxy_pass http://payment_backend/api/v1/payments;
        }
        location /api/v1/otp {
            proxy_pass http://payment_backend/api/v1/otp;
        }
    }
}
